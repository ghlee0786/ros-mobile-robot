<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="Inter, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" role="img" aria-label="Velocity command safety path">
  <title>Velocity command safety path · 속도 명령 안전 경로</title>
  <!-- 한 주기 6 s: 0–3 s 정상, 3 s 연결 끊김, 3–4.5 s 타이머(실측 0.45 s 를 느리게 표시), 4.5–6 s 워치독이 0 발행 → 정지 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0D10"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
    <path id="in1" d="M184 152 C 200 152, 200 208, 216 208 H 432"/>
    <path id="in2" d="M184 208 H 432"/>
    <path id="in3" d="M184 264 C 200 264, 200 208, 216 208 H 432"/>
    <path id="out" d="M608 208 H 1112"/>
    <style>
      .box { fill: #171A20; stroke: #FFFFFF; stroke-opacity: 0.1; }
      .h { fill: #E8EAED; font-weight: 700; }
      .t { fill: #E8EAED; font-weight: 600; }
      .s { fill: #A3A9B2; }
      .m { font-family: ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace; }
    </style>
  </defs>

  <rect width="1200" height="440" fill="url(#bg)"/>
  <text x="32" y="44" font-size="22" class="h">Velocity command safety path <tspan class="s" font-weight="400">· 속도 명령 안전 경로</tspan></text>
  <text x="32" y="70" font-size="13" class="s">모든 원격 속도 명령은 파이의 cmd_watchdog 를 거친다 — 0.5 s 동안 명령이 끊기면 0 을 내보내 로봇을 세운다.</text>

  <!-- 연결선 -->
  <g fill="none" stroke-width="2">
    <use href="#in1" stroke="#4C9AFF" stroke-opacity="0.5"/>
    <use href="#in3" stroke="#4C9AFF" stroke-opacity="0.5"/>
    <path d="M184 208 H 352" stroke="#4C9AFF" stroke-opacity="0.5"/>
    <use href="#out" stroke="#FFFFFF" stroke-opacity="0.18"/>
  </g>
  <!-- 끊기는 구간 (352–432) -->
  <g>
    <line x1="352" y1="208" x2="432" y2="208" stroke="#4C9AFF" stroke-width="2"/>
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <line x1="352" y1="208" x2="380" y2="208" stroke="#D93A40" stroke-width="2"/>
    <line x1="404" y1="208" x2="432" y2="208" stroke="#D93A40" stroke-width="2"/>
    <path d="M386 202l12 12M398 202l-12 12" stroke="#D93A40" stroke-width="2" stroke-linecap="round"/>
    <text x="392" y="240" font-size="11" fill="#D93A40" text-anchor="middle">끊김</text>
    <text x="392" y="254" font-size="10" fill="#D93A40" text-anchor="middle">link lost</text>
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.5" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- 입력 패킷 (정상 구간에만) -->
  <g>
    <circle r="4" fill="#4C9AFF"><animateMotion dur="1s" repeatCount="indefinite"><mpath href="#in1"/></animateMotion></circle>
    <circle r="4" fill="#4C9AFF"><animateMotion dur="1s" begin="-0.33s" repeatCount="indefinite"><mpath href="#in2"/></animateMotion></circle>
    <circle r="4" fill="#4C9AFF"><animateMotion dur="1s" begin="-0.66s" repeatCount="indefinite"><mpath href="#in3"/></animateMotion></circle>
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  </g>
  <!-- 명령 출처 -->
  <g font-size="13">
    <rect class="box" x="32" y="132" width="152" height="40" rx="10"/><text x="48" y="157" class="t">대시보드 <tspan class="s" font-size="11">Dashboard</tspan></text>
    <rect class="box" x="32" y="188" width="152" height="40" rx="10"/><text x="48" y="213" class="t">키보드 <tspan class="s" font-size="11">teleop</tspan></text>
    <rect class="box" x="32" y="244" width="152" height="40" rx="10"/><text x="48" y="269" class="t">Nav2 <tspan class="s" font-size="11">controller</tspan></text>
  </g>

  <!-- 토픽 알약 -->
  <rect x="216" y="194" width="136" height="28" rx="14" fill="#0B0D10" stroke="#4C9AFF" stroke-opacity="0.7"/>
  <text x="284" y="212" font-size="12" class="t m" text-anchor="middle">/teleop/cmd_vel</text>
  <rect x="648" y="194" width="96" height="28" rx="14" fill="#0B0D10" stroke="#FFFFFF" stroke-opacity="0.2"/>
  <text x="696" y="212" font-size="12" class="t m" text-anchor="middle">/cmd_vel</text>

  <!-- 워치독 -->
  <rect class="box" x="432" y="128" width="176" height="160" rx="16" stroke-width="2">
    <animate attributeName="stroke" values="#2EA043;#D29922;#D93A40" keyTimes="0;0.5;0.75" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.8" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="520" y="160" font-size="15" class="h m" text-anchor="middle">cmd_watchdog</text>
  <text x="520" y="180" font-size="11" class="s" text-anchor="middle">끊김 0.5 s → 0 발행</text>
  <circle cx="520" cy="236" r="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="5"/>
  <circle cx="520" cy="236" r="24" fill="none" stroke="#D29922" stroke-width="5" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="150.8" transform="rotate(-90 520 236)">
    <animate attributeName="stroke-dashoffset" values="150.8;150.8;0;0;150.8" keyTimes="0;0.5;0.75;0.995;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#D29922;#D93A40" keyTimes="0;0.75" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="520" y="240" font-size="11" class="t" text-anchor="middle">0.45 s</text>

  <!-- STOP 배지 -->
  <g opacity="0">
    <rect x="640" y="132" width="112" height="32" rx="16" fill="#D93A40"/>
    <text x="696" y="153" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">STOP · v=0</text>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.75;0.995" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- control_node · Pico · 모터 -->
  <rect class="box" x="792" y="176" width="136" height="64" rx="12"/>
  <text x="860" y="204" font-size="13" class="t m" text-anchor="middle">control_node</text>
  <text x="860" y="224" font-size="11" class="s" text-anchor="middle">바퀴 목표 속도</text>
  <rect class="box" x="960" y="176" width="120" height="64" rx="12"/>
  <text x="1020" y="204" font-size="13" class="t" text-anchor="middle">Pico</text>
  <text x="1020" y="224" font-size="11" class="s" text-anchor="middle">PID 30 ms</text>
  <text x="944" y="264" font-size="10" class="s" text-anchor="middle">USB CRC16</text>
  <g>
    <circle cx="1144" cy="208" r="24" fill="#171A20" stroke="#A3A9B2" stroke-width="2"/>
    <g stroke="#A3A9B2" stroke-width="3" stroke-linecap="round">
      <line x1="1144" y1="208" x2="1144" y2="190"/>
      <line x1="1144" y1="208" x2="1159.6" y2="217"/>
      <line x1="1144" y1="208" x2="1128.4" y2="217"/>
      <animateTransform attributeName="transform" type="rotate" values="0 1144 208;1620 1144 208;1800 1144 208;1800 1144 208" keyTimes="0;0.75;0.85;1" calcMode="spline" keySplines="0 0 1 1;0.16 1 0.3 1;0 0 1 1" dur="6s" repeatCount="indefinite"/>
    </g>
    <circle cx="1144" cy="208" r="4" fill="#E8EAED"/>
  </g>
  <text x="1144" y="256" font-size="11" class="s" text-anchor="middle">모터</text>

  <!-- 출력 패킷: 정상 = 파랑, 정지 = 빨강 0 -->
  <g>
    <circle r="4" fill="#4C9AFF"><animateMotion dur="1.2s" repeatCount="indefinite"><mpath href="#out"/></animateMotion></circle>
    <circle r="4" fill="#4C9AFF"><animateMotion dur="1.2s" begin="-0.4s" repeatCount="indefinite"><mpath href="#out"/></animateMotion></circle>
    <circle r="4" fill="#4C9AFF"><animateMotion dur="1.2s" begin="-0.8s" repeatCount="indefinite"><mpath href="#out"/></animateMotion></circle>
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <g><circle r="7" fill="#D93A40"/><text y="3.5" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">0</text><animateMotion dur="1.2s" repeatCount="indefinite"><mpath href="#out"/></animateMotion></g>
    <g><circle r="7" fill="#D93A40"/><text y="3.5" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">0</text><animateMotion dur="1.2s" begin="-0.6s" repeatCount="indefinite"><mpath href="#out"/></animateMotion></g>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.75;0.995" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- 아래 타임라인 -->
  <g transform="translate(32 320)">
    <rect width="1136" height="88" rx="12" fill="#111318" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <rect x="16" y="20" width="552" height="8" rx="4" fill="#2EA043" fill-opacity="0.7"/>
    <rect x="576" y="20" width="272" height="8" rx="4" fill="#D29922" fill-opacity="0.8"/>
    <rect x="856" y="20" width="264" height="8" rx="4" fill="#D93A40" fill-opacity="0.8"/>
    <text x="16" y="54" font-size="13" class="t">① 정상 — 명령이 흐른다</text>
    <text x="16" y="74" font-size="11" class="s">commands stream through the watchdog</text>
    <text x="576" y="54" font-size="13" class="t">② 끊김 감지 · 타이머</text>
    <text x="576" y="74" font-size="11" class="s">client killed / link down</text>
    <text x="856" y="54" font-size="13" class="t">③ 0 발행 → 정지</text>
    <text x="856" y="74" font-size="11" class="s">실측 0.45 s (rosbridge) · 0.51 s (DDS)</text>
    <g>
      <rect x="-1" y="10" width="2" height="28" rx="1" fill="#E8EAED"/>
      <circle cy="24" r="5" fill="#E8EAED"/>
      <animateTransform attributeName="transform" type="translate" values="16 0;1120 0" dur="6s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
