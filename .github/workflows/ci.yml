name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  mockbridge:
    name: 모의 rosbridge 시험 · mockbridge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "websockets>=12,<14" websocket-client pytest pillow
      - run: python -m pytest tooling/mockbridge/tests -q
  assets:
    name: README 그림 검사 · README asset check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -I docs/assets/check_assets.py
  mcp:
    name: MCP 서버 시험 · MCP server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "mcp>=1.2" "websockets>=12,<14" pytest
      - run: python -m pytest tooling/mcp -q -p no:cacheprovider
  robot-logic:
    name: 로봇 쪽 판단 시험 · obstacle guard · nav goal bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest tooling/rpi/robot_link/test_obstacle_guard.py tooling/nav/test_nav_goal_bridge.py
