# slam_toolbox (online async) for the robot: RPLIDAR /scan, frames map -> odom -> base_link.
slam_toolbox:
  ros__parameters:
    use_sim_time: false
    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan_filtered     # robot self-hits removed (scan_filter.yaml)
    resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.3
    transform_publish_period: 0.05
    map_update_interval: 2.0
    transform_timeout: 0.5          # scans/TF arrive over Wi-Fi from the Pi
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    minimum_travel_distance: 0.15   # the robot is slow (<= 0.1 m/s)
    minimum_travel_heading: 0.15
    use_scan_matching: true
    use_scan_barycenter: true
    do_loop_closing: true
    debug_logging: false
    throttle_scans: 1
